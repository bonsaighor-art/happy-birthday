<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0b1c, #3a1c38);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        .card {
            background: rgba(20, 20, 20, 0.75);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }

        /* CSS দিয়ে তৈরি কেক ডিজাইন (ভিডিওর স্টাইলে) */
        .cake-container {
            position: relative;
            width: 120px;
            height: 110px;
            margin: 0 auto 20px auto;
            animation: buildCake 1.5s ease-out;
        }

        /* কেকের বেস বা তলার অংশ */
        .cake-base {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 100px;
            height: 60px;
            background: #e6c280;
            border-radius: 0 0 15px 15px;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.1);
        }

        /* কেকের ক্রিম লেয়ার */
        .cake-frosting {
            position: absolute;
            top: 40px;
            left: 5px;
            width: 110px;
            height: 25px;
            background: #fff;
            border-radius: 15px;
        }

        /* মোমবাতি */
        .candle {
            position: absolute;
            top: 10px;
            left: 52px;
            width: 12px;
            height: 35px;
            background: #87ceeb;
            border-radius: 3px;
        }

        /* মোমবাতির আগুন */
        .flame {
            position: absolute;
            top: -12px;
            left: 2px;
            width: 8px;
            height: 14px;
            background: #ffcc00;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.5s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 5px #ff416c); }
        }

        @keyframes buildCake {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #ffb6c1;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #ddd;
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
        }

        /* Floating hearts background */
        .heart {
            position: absolute;
            background: rgba(255, 182, 193, 0.7);
            transform: rotate(-45deg);
            animation: float linear infinite;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.7);
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: 50%; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(-45deg) scale(var(--scale)); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(-45deg) scale(var(--scale)); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating Hearts Animation -->
    <script>
        function createHearts() {
            const heartCount = 50;
            const body = document.body;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');

                const size = Math.random() * 20 + 10;
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.left = `${Math.random() * 100}vw`;
                
                const duration = Math.random() * 5 + 5;
                heart.style.animationDuration = `${duration}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.opacity = Math.random() * 0.5 + 0.2;
                heart.style.setProperty('--scale', Math.random() * 0.5 + 0.5);

                body.appendChild(heart);
            }
        }
        createHearts();
    </script>

    <!-- Center Card -->
    <div class="card">
        <!-- ভিডিওর মতো ডিজাইন করা কেক -->
        <div class="cake-container">
            <div class="cake-base"></div>
            <div class="cake-frosting"></div>
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>
        <h1>বুড়ো হওয়া মোবারক</h1>
        <p>আরও এক বছর বুড়ি হয়ে গেলি, কিন্তু তোর বোকামি একটাও কমল না। শুভ জন্মদিন আমার পাগলী বান্ধবী!</p>
    </div>

</body>
</html>
