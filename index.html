<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0b1c, #3a1c38);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
            color: white;
        }
        .card {
            background: rgba(20, 20, 20, 0.75);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            max-width: 350px;
            backdrop-filter: blur(10px);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: cakePop 1.5s ease-in-out infinite alternate;
        }
        @keyframes cakePop {
            0% { transform: scale(0.9) translateY(0); }
            100% { transform: scale(1.1) translateY(-5px); }
        }

        h1 {
            color: #ffb6c1;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #ddd;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Floating hearts with text background */
        .heart {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 182, 193, 0.85);
            transform: rotate(-45deg);
            animation: floatUp linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.85);
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: 50%; }

        .heart-text {
            position: absolute;
            transform: rotate(45deg);
            font-size: 8px;
            color: #4a0e17;
            font-weight: bold;
            white-space: nowrap;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(-45deg) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(-45deg) scale(1.1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <script>
        function createHearts() {
            const heartCount = 70;
            const body = document.body;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');

                const size = Math.random() * 25 + 20; 
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.left = `${Math.random() * 100}vw`;
                
                const duration = Math.random() * 5 + 3; // ৩ থেকে ৮ সেকেন্ড গতির ব্যাপ্তি
                heart.style.animationDuration = `${duration}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;

                const textSpan = document.createElement('span');
                textSpan.classList.add('heart-text');
                textSpan.innerText = "Happy Birthday";
                heart.appendChild(textSpan);

                body.appendChild(heart);
            }
        }
        createHearts();
    </script>

    <!-- Center Card -->
    <div class="card">
        <div class="icon">🎂</div>
        <h1>বুড়ো হওয়া মোবারক</h1>
        <p>আরও এক বছর বুড়ি হয়ে গেলি, কিন্তু তোর বোকামি একটাও কমল না। শুভ জন্মদিন আমার পাগলী বান্ধবী!</p>
    </div>

</body>
</html>
