<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0b1c, #3a1c38);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        .card {
            background: rgba(20, 20, 20, 0.75);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            max-width: 350px;
            backdrop-filter: blur(10px);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: cakePop 1.5s ease-in-out infinite alternate;
        }
        @keyframes cakePop {
            0% { transform: scale(0.9) translateY(0); }
            100% { transform: scale(1.1) translateY(-5px); }
        }

        h1 {
            color: #ffb6c1;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #ddd;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Floating elements (Hearts + Happy Birthday text) */
        .floating-item {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 182, 193, 0.8);
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            animation: float linear infinite;
        }

        .heart-icon {
            width: 15px;
            height: 15px;
            background: rgba(255, 182, 193, 0.8);
            transform: rotate(-45deg);
            position: relative;
            display: inline-block;
        }
        .heart-icon::before, .heart-icon::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.8);
            border-radius: 50%;
        }
        .heart-icon::before { top: -50%; left: 0; }
        .heart-icon::after { top: 0; left: 50%; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(var(--scale)); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(var(--scale)); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating Hearts with "Happy Birthday" Text -->
    <script>
        function createFloatingElements() {
            const count = 30; // আইটেমের সংখ্যা
            const body = document.body;

            for (let i = 0; i < count; i++) {
                const item = document.createElement('div');
                item.classList.add('floating-item');

                // লাভ আইকন এবং টেক্সট তৈরি
                const heart = document.createElement('div');
                heart.classList.add('heart-icon');

                const text = document.createElement('span');
                text.innerText = "Happy Birthday ❤️";

                item.appendChild(heart);
                item.appendChild(text);

                // র‍্যান্ডম অবস্থান ও গতি
                item.style.left = `${Math.random() * 90}vw`;
                
                const duration = Math.random() * 6 + 6; // ৬ থেকে ১২ সেকেন্ড সময় নেবে উপরে উঠতে
                item.style.animationDuration = `${duration}s`;
                item.style.animationDelay = `${Math.random() * 6}s`;
                
                item.style.setProperty('--scale', Math.random() * 0.4 + 0.8);

                body.appendChild(item);
            }
        }
        createFloatingElements();
    </script>

    <!-- Center Card -->
    <div class="card">
        <div class="icon">🎂</div>
        <h1>বুড়ো হওয়া মোবারক</h1>
        <p>আরও এক বছর বুড়ি হয়ে গেলি, কিন্তু তোর বোকামি একটাও কমল না। শুভ জন্মদিন আমার পাগলী বান্ধবী!</p>
    </div>

</body>
</html>
