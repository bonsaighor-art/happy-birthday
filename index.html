<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0b1c, #3a1c38);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        .card {
            background: rgba(20, 20, 20, 0.75);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            max-width: 350px;
            backdrop-filter: blur(10px);
        }

        /* ভিডিওর মতো কেক তৈরির বা বিল্ড হওয়ার অ্যানিমেশন */
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: buildCake 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
        }

        @keyframes buildCake {
            0% {
                transform: scale(0.2) translateY(50px);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) translateY(-10px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        h1 {
            color: #ffb6c1;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #ddd;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Floating hearts background */
        .heart {
            position: absolute;
            background: rgba(255, 182, 193, 0.7);
            transform: rotate(-45deg);
            animation: float linear infinite;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.7);
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: 50%; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(-45deg) scale(var(--scale)); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(-45deg) scale(var(--scale)); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating Hearts Animation -->
    <script>
        function createHearts() {
            const heartCount = 50;
            const body = document.body;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');

                const size = Math.random() * 20 + 10;
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.left = `${Math.random() * 100}vw`;
                
                const duration = Math.random() * 5 + 5;
                heart.style.animationDuration = `${duration}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.opacity = Math.random() * 0.5 + 0.2;
                heart.style.setProperty('--scale', Math.random() * 0.5 + 0.5);

                body.appendChild(heart);
            }
        }
        createHearts();
    </script>

    <!-- Center Card -->
    <div class="card">
        <!-- ভিডিওর স্টাইলে অ্যানিমেটেড কেক -->
        <div class="icon">🎂</div>
        <h1>বুড়ো হওয়া মোবারক</h1>
        <p>আরও এক বছর বুড়ি হয়ে গেলি, কিন্তু তোর বোকামি একটাও কমল না। শুভ জন্মদিন আমার পাগলী বান্ধবী!</p>
    </div>

</body>
</html>
